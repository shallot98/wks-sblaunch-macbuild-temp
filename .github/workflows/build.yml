name: build-sblaunch
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          brew update
          brew install ldid make
          git clone --recursive https://github.com/theos/theos "$HOME/theos"
      - name: iphoneos 16.5 sdk
        run: |
          mkdir -p "$HOME/theos/sdks"
          curl -fsSL -o /tmp/sdk.tar.xz "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xJf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"
          ls -d "$HOME/theos/sdks/iPhoneOS16.5.sdk"
      - name: build
        run: |
          export PATH="$(brew --prefix make)/bin:$PATH"
          cd WeTypeVoiceSBLaunch
          THEOS="$HOME/theos" THEOS_PACKAGE_SCHEME=rootless make clean all FINALPACKAGE=1 \
            ARCHS="arm64 arm64e" TARGET=iphone:clang:16.5:14.0
      - name: abi proof
        run: |
          cd WeTypeVoiceSBLaunch
          echo "----- otool -hv (arm64e slice MUST show USR00) -----"
          otool -hv .theos/obj/WeTypeVoiceSBLaunch.dylib
          echo "----- deps -----"
          otool -L .theos/obj/WeTypeVoiceSBLaunch.dylib
          ls -l .theos/obj/
      - uses: actions/upload-artifact@v4
        with:
          name: sblaunch-dylib
          path: WeTypeVoiceSBLaunch/.theos/obj/WeTypeVoiceSBLaunch.dylib
