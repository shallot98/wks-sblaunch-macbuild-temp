name: build-sblaunch
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          brew update
          brew install ldid make
          git clone --recursive https://github.com/theos/theos "$HOME/theos"
      - name: build
        run: |
          export PATH="$(brew --prefix make)/bin:$PATH"
          cd WeTypeVoiceSBLaunch
          THEOS="$HOME/theos" make clean all FINALPACKAGE=1 \
            ARCHS="arm64 arm64e" TARGET=iphone:clang:latest:15.0
      - name: abi proof
        run: |
          cd WeTypeVoiceSBLaunch
          echo "----- otool -hv (arm64e slice MUST show USR00) -----"
          otool -hv .theos/obj/WeTypeVoiceSBLaunch.dylib
          echo "----- deps -----"
          otool -L .theos/obj/WeTypeVoiceSBLaunch.dylib
          ls -l .theos/obj/
      - uses: actions/upload-artifact@v4
        with:
          name: sblaunch-dylib
          path: WeTypeVoiceSBLaunch/.theos/obj/WeTypeVoiceSBLaunch.dylib
